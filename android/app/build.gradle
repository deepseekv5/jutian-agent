// 应用级构建脚本
plugins {
    id 'com.android.application' version '8.7.2'
}

// 两个发行形态，用构建参数切换（不用 productFlavors：AGP 8.7 的 flavor 级
// externalNativeBuild DSL 解析不到，参数化更稳、更好排查）：
//   gradle assembleRelease                 → 远控版（~60KB，只做界面壳）
//   gradle assembleRelease -PlocalApk      → 本地版（~40MB，内置 Node 运行时）
// 两种包 applicationId 相同，装哪个用哪个。
def localApk = project.hasProperty("localApk")

android {
    namespace 'com.jutian.agent'
    compileSdk 35
    // 本地版需要 NDK 编译 JNI 桥（node_bridge.cpp）。
    // 允许用 -PndkVersion=... 覆盖：CI 与本地装着的 NDK 版本不一定相同。
    ndkVersion project.findProperty("ndkVersion") ?: "26.1.10909125"

    defaultConfig {
        applicationId "com.jutian.agent"
        minSdk 24          // Android 7.0+，覆盖绝大多数在用设备
        targetSdk 35
        versionCode 13070000
        versionName "13.7.0"
        buildConfigField "String", "MODE", localApk ? '"local"' : '"remote"'
        // 本地版：单包通用（v13.6.6）——三个 ABI 的运行时全打进一个 APK，
        // 任何设备装同一个包都能跑，不需要用户判断架构（体积约 100MB）。
        if (localApk) {
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        }
    }



    // 本地版才挂原生桥与内置资源；远控版保持 60KB 体量
    if (localApk) {
        externalNativeBuild {
            cmake { path = file("src/main/cpp/CMakeLists.txt") }
        }
        sourceSets {
            main {
                jniLibs.srcDirs += "src/local/jniLibs"
                assets.srcDirs += "src/local/assets"
            }
        }
    }

    // 原生库解压安装（v13.6.2）：默认会直接从 APK 内 mmap 未压缩的 .so，
    // 老构建的 4KB 段对齐库在 16KB 页设备上加载会失败；解压到 lib 目录后
    // 由安装器处理对齐，兼容性更好（代价是安装占用略增）。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures { buildConfig true }

    // 签名配置从 keystore.properties 读（该文件与 keystore 都不入库）。
    // 没有这个文件时（如 CI）跳过签名，仍能产出 debug 包。
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        def ks = new Properties()
        ksFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 不混淆：这是壳应用，代码量极小，混淆反而增加排查难度
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    lint {
        // release 构建不跑 lint：AGP 8.7 的 lint 在 JDK 25 下会崩
        // （Unsupported class file major version）。壳应用代码量极小，
        // lint 的收益远小于它在构建链上的风险。
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 无第三方依赖：WebView 是系统组件，配置界面用原生控件
