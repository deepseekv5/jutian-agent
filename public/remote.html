<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0b">
<title>巨天agent · 远程</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--line:rgba(255,255,255,.09);--ink:#f5f5f4;--ink2:rgba(245,245,244,.62);--ink3:rgba(245,245,244,.4);--acc:#10a37f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-shrink:0}
header .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(150deg,#10a37f,#0b7a5e);display:grid;place-items:center;flex-shrink:0}
header .mark svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
header b{font-size:15px;letter-spacing:-.01em}
header .st{margin-left:auto;font-size:10.5px;color:var(--ink3);font-family:ui-monospace,Menlo,monospace}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 会话列表 */
.sess{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.sess:active{background:var(--card)}
.sess .tt{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .tm{margin-left:auto;font-size:10.5px;color:var(--ink3);font-family:ui-monospace,Menlo,monospace;flex-shrink:0}
.new{margin:14px 16px;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;background:var(--acc);color:#fff;font-size:14.5px;font-weight:600;border:0;width:calc(100% - 32px)}
/* 聊天 */
#msgs{padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.m{max-width:82%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:#26262a;border-bottom-right-radius:5px}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.m.sys{align-self:center;background:transparent;color:var(--ink3);font-size:12px;padding:2px}
.m .tl{display:block;font-size:11px;color:var(--acc);font-family:ui-monospace,Menlo,monospace;margin-top:6px}
/* 输入 */
#inputbar{flex-shrink:0;display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:var(--bg)}
#inp{flex:1;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:15px;padding:0 18px;outline:none}
#inp:focus{border-color:var(--acc)}
#send{width:44px;height:44px;border-radius:99px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:17px}
#send:disabled{opacity:.35}
/* 配对失效 */
.err{margin:auto;text-align:center;padding:32px}
.err b{font-size:17px}
.err p{margin-top:10px;color:var(--ink3);font-size:13px;line-height:1.7}
.loading{margin:auto;text-align:center;color:var(--ink3);font-size:13px;padding:32px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:99px;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
.back{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--ink);font-size:19px;display:grid;place-items:center}
</style>
<style>
/* Markdown 渲染 */
.md-body h1,.md-body h2,.md-body h3{margin:10px 0 6px;line-height:1.35}
.md-body h1{font-size:1.2em}.md-body h2{font-size:1.12em}.md-body h3{font-size:1.05em}
.md-body p{margin:6px 0}
.md-body ul,.md-body ol{margin:6px 0;padding-left:22px}
.md-body li{margin:3px 0}
.md-body code{font-family:ui-monospace,Menlo,monospace;font-size:.86em;background:rgba(255,255,255,.1);padding:2px 5px;border-radius:5px}
.md-body pre{background:#05070d;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:8px 0}
.md-body pre code{background:transparent;padding:0;font-size:.9em;line-height:1.7;color:#dbe4ee}
.md-body blockquote{margin:8px 0;padding:2px 12px;border-left:2px solid var(--acc);color:var(--ink2)}
.md-body a{color:var(--acc)}
.md-body table{border-collapse:collapse;margin:8px 0;font-size:.88em;width:100%}
.md-body th,.md-body td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.md-body hr{border:0;border-top:1px solid var(--line);margin:10px 0}
/* 思考 */
.think{margin-bottom:8px;font-size:12px;color:var(--ink3)}
.think summary{cursor:pointer}
.think div{margin-top:6px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);line-height:1.6;max-height:150px;overflow-y:auto;white-space:pre-wrap}
/* 工具卡 */
.tool{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden}
.tool-h{display:flex;align-items:center;gap:7px;padding:8px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink2)}
.tool-i{color:var(--acc);flex-shrink:0}
.tool-n{font-weight:600;color:var(--ink);flex-shrink:0}
.tool-s{color:#ef4444;flex-shrink:0}
.tool-c{margin-left:auto;color:var(--ink3)}
.tool-a{padding:0 12px 8px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-r{border-top:1px solid var(--line);padding:9px 12px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink2);max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
/* 子代理进度卡 */
.subbatch{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.03)}
.sub{padding:5px 0;border-bottom:1px dashed var(--line)}
.sub:last-child{border-bottom:0}
.sub-h{display:flex;align-items:center;gap:8px}
.sub-n{font-size:12px;font-weight:600;color:var(--ink)}
.sub-p{margin-left:auto;font-size:10px;color:var(--ink3)}
.pb{height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.pf{height:100%;border-radius:99px;background:var(--acc);transition:width .4s ease}
.pf.run{animation:subslide 1.2s ease-in-out infinite}
@keyframes subslide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
.sub-o{margin-top:5px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-img{width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line)}
.dim{color:var(--ink3)}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span></div></div>

<script>
(function () {
  'use strict'
  var qs = new URLSearchParams(location.search)
  var TOKEN = qs.get('t') || localStorage.getItem('remote-token') || ''
  if (qs.get('t')) { try { localStorage.setItem('remote-token', TOKEN) } catch (e) {} }
  var HDR = { 'Content-Type': 'application/json', 'X-Remote-Token': TOKEN }
  var app = document.getElementById('app')
  var MODEL = 'auto'
  var current = null

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }

  /* Markdown:先转义裸 HTML(安全),再交给 marked;聊天断行 */
  var mdParser = new MarkedLib.Marked({ gfm: true, breaks: true })
  function md(text) {
    if (!text) return ''
    // marked 对 [x](javascript:…) 这类链接不拦,渲染后统一中和脚本类地址
    return mdParser.parse(String(text).replace(/</g, '&lt;'))
      .replace(/ href="(?:javascript|vbscript):[^"]*"/gi, ' href="#"')
  }

  function api(path, opts) {
    opts = opts || {}
    opts.headers = Object.assign({}, HDR, opts.headers || {})
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { renderBadPairing(); throw new Error('unauthorized') }
      return r.json()
    })
  }
  function rel(t) {
    if (!t) return ''
    var d = Date.now() - new Date(t).getTime()
    if (d < 3600000) return Math.max(1, Math.floor(d / 60000)) + 'min'
    if (d < 86400000) return Math.floor(d / 3600000) + 'h'
    var dt = new Date(t)
    return (dt.getMonth() + 1) + '/' + dt.getDate()
  }

  function renderBadPairing() {
    app.innerHTML = '<div class="err"><b>' + (LANG_EN ? 'Pairing expired' : '配对已失效') + '</b><p>' + (LANG_EN ? 'Generate a new pairing code on the desktop<br>(Settings → Remote) and reopen the link.' : '请在电脑端「设置 → 手机远程」<br>重新生成配对码，并用新链接打开。') + '</p></div>'
  }
  var LANG_EN = false

  /* ─── 会话列表 ─── */
  function renderList() {
    current = null
    app.innerHTML = '<header><span class="mark"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 8h11.2"/><path d="M17.6 8v8"/><path d="M6.4 16h11.2"/><path d="M6.4 8v8"/><path d="M6.4 12h11.2"/></svg></span><b>巨天agent</b><span class="st">' + (LANG_EN ? 'Remote' : '远程') + '</span></header><div id="view"><div class="loading"><span class="spin"></span></div></div>'
    var view = document.getElementById('view')
    api('/api/sessions').then(function (list) {
      var html = '<button class="new" id="new">' + (LANG_EN ? '+ New chat' : '＋ 新对话') + '</button>'
      if (!list.length) html += '<div class="loading">' + (LANG_EN ? 'No conversations yet' : '还没有对话') + '</div>'
      list.forEach(function (s) {
        html += '<div class="sess" data-id="' + esc(s.id) + '"><span class="tt">' + esc(s.title || '新对话') + '</span><span class="tm">' + rel(s.updated_at || s.created_at) + '</span></div>'
      })
      view.innerHTML = html
      document.getElementById('new').onclick = function () {
        api('/api/sessions', { method: 'POST', body: JSON.stringify({ title: LANG_EN ? 'New chat' : '新对话' }) }).then(function (s) { renderChat(s.id, s.title || 'New chat') })
      }
      view.querySelectorAll('.sess').forEach(function (el) {
        el.onclick = function () { renderChat(el.getAttribute('data-id'), el.querySelector('.tt').textContent) }
      })
    }).catch(function (e) { if (e.message !== 'unauthorized') view.innerHTML = '<div class="loading">' + esc(e.message) + '</div>' })
  }

  /* ─── 聊天视图 ─── */
  function renderChat(id, title) {
    current = id
    app.innerHTML = '<header><button class="back" id="back">‹</button><b style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(title) + '</b><span class="st" id="st">' + esc(MODEL) + '</span></header><div id="view"><div id="msgs"><div class="loading"><span class="spin"></span></div></div></div><div id="inputbar"><input id="inp" placeholder="' + (LANG_EN ? 'Message Jutian Agent…' : '发消息…') + '" autocomplete="off"><button id="send" disabled>↑</button></div>'
    document.getElementById('back').onclick = renderList
    var msgs = document.getElementById('msgs')
    var inp = document.getElementById('inp')
    var sendBtn = document.getElementById('send')
    var view = document.getElementById('view')
    var screenshotUrls = []

    function bubble(cls, html) {
      var d = document.createElement('div')
      d.className = 'm ' + cls
      if (cls === 'a') d.innerHTML = html
      else d.textContent = html
      msgs.appendChild(d)
      view.scrollTop = view.scrollHeight
      return d
    }

    api('/api/sessions/' + id + '/messages').then(function (list) {
      msgs.innerHTML = ''
      list.forEach(function (m) {
        if (m.role === 'system' || m.role === 'tool') return
        if (m.role === 'user') { bubble('u', m.content || ''); return }
        var d = bubble('a', md(m.content || ''))
        renderTools(d, m.tool_calls)
      })
      if (!list.length) bubble('sys', LANG_EN ? 'No messages yet' : '这段对话还没有消息')
      sendBtn.disabled = false
    })

    /* 工具调用卡片 */
    function toolCard(container, name, argsStr, status, result) {
      var card = document.createElement('div')
      card.className = 'tool'
      var argsPreview = ''
      try { argsPreview = JSON.stringify(JSON.parse(argsStr || '{}')).slice(0, 90) } catch (e) { argsPreview = String(argsStr || '').slice(0, 90) }
      card.innerHTML = '<div class="tool-h"><span class="tool-i">' + (status === 'error' ? '✕' : '⚙') + '</span><span class="tool-n">' + esc(name) + '</span><span class="tool-s">' + (status === 'error' ? (LANG_EN ? 'failed' : '失败') : '') + '</span><span class="tool-c">▾</span></div><div class="tool-a">' + esc(argsPreview) + '</div><div class="tool-r" style="display:none">' + esc(String(result || '').slice(0, 2000)) + '</div>'
      var head = card.querySelector('.tool-h')
      head.onclick = function () {
        var r = card.querySelector('.tool-r')
        var open = r.style.display !== 'none'
        r.style.display = open ? 'none' : 'block'
        card.querySelector('.tool-c').textContent = open ? '▸' : '▾'
      }
      if (result) head.style.cursor = 'pointer'
      container.appendChild(card)
      view.scrollTop = view.scrollHeight
      return card
    }
    function renderTools(container, toolCalls) {
      if (!Array.isArray(toolCalls)) return
      toolCalls.forEach(function (tc) {
        toolCard(container, tc.name || '?', tc.arguments, tc.status || 'done', tc.result)
      })
    }

    /* SSE 一轮:文本 + 工具调用装配。noDispatch=true 时不含子代理派发(防递归) */
    function streamRound(apiMsgs, onText, onTools, onThink, noDispatch) {
      return fetch('/api/llm-proxy', { method: 'POST', headers: HDR, body: JSON.stringify((function () { var b = { model: MODEL, messages: apiMsgs, stream: true }; if (REMOTE_TOOLS) {
          var list = noDispatch ? REMOTE_TOOLS.filter(function (t) { return t.name !== 'dispatch_subagents' }) : REMOTE_TOOLS
          b.tools = list.map(function (t) { return { type: 'function', function: { name: t.name, description: t.description, parameters: t.parameters } } })
          b.tool_choice = 'auto'
        }
        return b })()) }).then(function (r) {
        if (!r.ok || !r.body) return r.json().catch(function () { return {} }).then(function (j) { throw new Error((j && j.error) || 'HTTP ' + r.status) })
        var reader = r.body.getReader()
        var dec = new TextDecoder()
        var buf = ''
        var text = '', think = ''
        var tcs = {}
        var order = []
        return (function pump() {
          return reader.read().then(function (chunk) {
            if (chunk.done) return { text: text, think: think, toolCalls: order.map(function (i) { return tcs[i] }) }
            buf += dec.decode(chunk.value, { stream: true })
            var idx
            while ((idx = buf.indexOf('\n')) >= 0) {
              var line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1)
              if (line.indexOf('data:') !== 0) continue
              var payload = line.slice(5).trim()
              if (payload === '[DONE]') continue
              var j; try { j = JSON.parse(payload) } catch (e) { continue }
              var delta = (j.choices && j.choices[0] && j.choices[0].delta) || {}
              if (delta.reasoning_content) { think += delta.reasoning_content; onThink(think) }
              if (delta.content) { text += delta.content; onText(text) }
              if (delta.tool_calls) {
                delta.tool_calls.forEach(function (tc) {
                  var i = tc.index != null ? tc.index : 0
                  if (!tcs[i]) { tcs[i] = { id: '', name: '', arguments: '', type: 'function' }; order.push(i) }
                  if (tc.id) tcs[i].id = tc.id
                  if (tc.function) {
                    if (tc.function.name) tcs[i].name += tc.function.name
                    if (tc.function.arguments) tcs[i].arguments += tc.function.arguments
                  }
                })
                onTools && onTools()
              }
            }
            return pump()
          })
        })()
      })
    }

    function send() {
      var text = inp.value.trim()
      if (!text || !current) return
      inp.value = ''
      sendBtn.disabled = true
      bubble('u', text)
      api('/api/sessions/' + current + '/messages', { method: 'POST', body: JSON.stringify({ role: 'user', content: text }) })

      api('/api/sessions/' + current + '/messages').then(function (history) {
        var apiMsgs = history.filter(function (m) { return m.role === 'user' || m.role === 'assistant' }).map(function (m) { return { role: m.role, content: m.content || '' } })
        var rounds = 0

        function round() {
          rounds++
          if (rounds > 8) { sendBtn.disabled = false; return }
          var d = bubble('a', '<span class="dim"><span class="spin"></span></span>')
          var wrote = false
          return streamRound(apiMsgs, function (full) {
            if (!wrote) { wrote = true; d.classList.remove('dim') }
            d.textContent = full + ' ▌'
            view.scrollTop = view.scrollHeight
          }, null, function (think) {
            if (!wrote) d.innerHTML = '<span class="dim">' + (LANG_EN ? 'thinking… ' : '思考中… ') + think.length + '</span>'
          }).then(function (res) {
            var toolCalls = res.toolCalls.filter(function (t) { return t.name })
            /* 保存本轮助手消息(含工具调用) */
            if (toolCalls.length) {
              var saveCalls = toolCalls.map(function (t, i) { return { id: t.id || ('c' + i), name: t.name.replace(/^mcp__/, ''), arguments: t.arguments, status: 'pending', result: '' } })
              d.remove()
              var d2 = bubble('a', res.text ? md(res.text) : '<span class="dim">' + (LANG_EN ? 'working…' : '执行中…') + '</span>')
              var screenshotUrls = []
              /* 逐个执行工具 */
              var chain = Promise.resolve()
              saveCalls.forEach(function (tc) {
                chain = chain.then(function () {
                  /* ── 子代理派发:手机侧嵌套循环 + 进度卡(与桌面侧栏一致) ── */
                  if (tc.name === 'dispatch_subagents') {
                    var agents = []
                    try { agents = JSON.parse(tc.arguments || '{}').agents || [] } catch (e) {}
                    var dsub = document.createElement('div')
                    dsub.className = 'subbatch'
                    d2.appendChild(dsub)
                    var sts = agents.slice(0, 5).map(function (a) { return { name: a.name, task: a.task, status: 'pending', phase: '排队中', out: '' } })
                    function paint() {
                      dsub.innerHTML = sts.map(function (s2) {
                        var bar = s2.status === 'done' ? '<div class="pb"><div class="pf" style="width:100%"></div></div>'
                          : s2.status === 'running' ? '<div class="pb"><div class="pf run" style="width:40%"></div></div>'
                          : '<div class="pb"><div class="pf" style="width:12%"></div></div>'
                        return '<div class="sub"><div class="sub-h"><span class="sub-n">' + esc(s2.name) + '</span><span class="sub-p">' + esc(s2.phase) + '</span></div>' + bar + (s2.out ? '<div class="sub-o">' + esc(s2.out) + '</div>' : '') + '</div>'
                      }).join('')
                      view.scrollTop = view.scrollHeight
                    }
                    paint()
                    var reports = []
                    var seq = Promise.resolve()
                    sts.forEach(function (s2) {
                      seq = seq.then(function () {
                        s2.status = 'running'; s2.phase = '开始执行'; paint()
                        var out = ''
                        return streamRound(
                          [{ role: 'system', content: '你是子代理「' + s2.name + '」，独立完成下面这个任务。可以使用工具真实地做（读文件/执行命令/搜索），最后输出简洁的结果报告：完成了什么、产出了什么、关键结论。' }, { role: 'user', content: s2.task }],
                          function (full) { out = full; s2.out = full.slice(-140); s2.phase = '执行中…'; paint() },
                          null, null, true
                        ).then(function (res2) { s2.status = 'done'; s2.phase = '完成'; s2.out = (res2.text || '').slice(-140); paint(); reports.push('【' + s2.name + '】' + (res2.text || '(无输出)').slice(0, 1500)) })
                          .catch(function () { s2.status = 'done'; s2.phase = '出错'; paint() })
                      })
                    })
                    return seq.then(function () {
                      var report = '所有子代理已完成，报告如下：\n\n' + reports.join('\n\n')
                      tc.status = 'done'
                      tc.result = report
                      return null
                    })
                  }
                  /* ── 普通工具:服务端执行 ── */
                  var card = toolCard(d2, tc.name, tc.arguments, 'running', '')
                  return fetch('/api/tools/execute', { method: 'POST', headers: HDR, body: JSON.stringify({ name: tc.name, args: (function () { try { return JSON.parse(tc.arguments || '{}') } catch (e) { return {} } })() }) }).then(function (r) { return r.json() }).then(function (out) {
                    tc.status = out.success ? 'done' : 'error'
                    tc.result = out.success ? (out.output || '') : (out.error || '失败')
                    var rc = card.querySelector('.tool-r')
                    rc.textContent = String(tc.result).slice(0, 2000)
                    card.querySelector('.tool-i').textContent = tc.status === 'error' ? '✕' : '✓'
                    card.querySelector('.tool-s').textContent = ''
                    /* 截图:卡片内渲染图片,并记住 URL 供多模态回喂 */
                    if (out.image) {
                      screenshotUrls.push(out.image)
                      var im = document.createElement('img')
                      im.className = 'tool-img'
                      im.src = out.image
                      card.appendChild(im)
                      view.scrollTop = view.scrollHeight
                    }
                    return null
                  })
                })
              })
              return chain.then(function () {
                /* 保存带结果的助手消息 */
                api('/api/sessions/' + current + '/messages', { method: 'POST', body: JSON.stringify({ role: 'assistant', content: res.text || '', tool_calls: saveCalls }) })
                /* 喂回模型继续 */
                apiMsgs.push({ role: 'assistant', content: res.text || '', tool_calls: toolCalls.map(function (t) { return { id: t.id, type: 'function', function: { name: t.name, arguments: t.arguments } } }) })
                toolCalls.forEach(function (t, i) {
                  var saved = saveCalls[i]
                  apiMsgs.push({ role: 'tool', tool_call_id: t.id, content: saved.result })
                })
                /* 截图多模态回喂:把截图转成 dataURL 塞进下一轮 */
                var feedImages = screenshotUrls.slice()
                screenshotUrls = []
                var imgSeq = Promise.resolve()
                feedImages.forEach(function (u) {
                  imgSeq = imgSeq.then(function () {
                    return fetch(u, { headers: HDR }).then(function (r) { return r.blob() }).then(function (blob) {
                      return new Promise(function (done) { var fr = new FileReader(); fr.onload = function () { done(fr.result) }; fr.readAsDataURL(blob) })
                    }).then(function (dataUrl) {
                      apiMsgs.push({ role: 'user', content: [{ type: 'text', text: '这是刚才的屏幕截图，请结合它继续。' }, { type: 'image_url', image_url: { url: dataUrl } }] })
                    })
                  })
                })
                return imgSeq.then(function () {
                  d2.remove()
                  return round()
                })
              })
            }
            /* 普通回复:渲染 markdown 并落库 */
            d.innerHTML = md(res.text || '（无回复）')
            renderThink(d, res.think)
            return api('/api/sessions/' + current + '/messages', { method: 'POST', body: JSON.stringify({ role: 'assistant', content: res.text || '' }) }).then(function () { sendBtn.disabled = false; view.scrollTop = view.scrollHeight })
          }).catch(function (e) {
            d.textContent = (LANG_EN ? 'Error: ' : '出错: ') + e.message
            sendBtn.disabled = false
          })
        }
        round()
      })

      function renderThink(d, think) {
        if (!think) return
        var det = document.createElement('details')
        det.className = 'think'
        det.innerHTML = '<summary>' + (LANG_EN ? 'Reasoning' : '思考过程') + ' · ' + think.length + '</summary>'
        var body = document.createElement('div')
        body.textContent = think
        det.appendChild(body)
        d.insertBefore(det, d.firstChild)
      }
    }
    sendBtn.onclick = send
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') send() })
    inp.addEventListener('input', function () { sendBtn.disabled = !inp.value.trim() })
    setTimeout(function () { inp.focus() }, 100)
  }

  var LANG_EN = false
  var REMOTE_TOOLS = null
  /* ─── 启动 ─── */
  api('/api/remote/session').then(function (r) { MODEL = r.model || 'auto' }).catch(function () {})
  api('/api/remote/tools').then(function (r) { REMOTE_TOOLS = r.tools || null }).catch(function () {})
  renderList()
})()
</script>
</body>
</html>
