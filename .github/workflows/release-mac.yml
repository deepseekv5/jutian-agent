# macOS 构建（GitHub Actions）
#
# macos-latest 是 Apple Silicon（arm64）。x64 包在同一台 runner 上交叉
# 编译：Xcode 原生支持双架构，better-sqlite3 也有 darwin-x64 的
# Electron ABI 预编译包，@electron/rebuild -a x64 直接下载。
#
# 两个架构用 matrix 并行跑，产物各自上传到同一 tag 的 Release。
# 产物名统一改 ASCII（中文资产名会被编码层吃前缀，实测踩过）。

name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建后端
        run: npm run build:server

      - name: 构建前端
        run: npx vite build

      # better-sqlite3 换 Electron ABI（33.4.11）。预编译包直接下载，
      # 不触发本地编译（本机的 macOS 27 CLT 头文件坑在 CI 上不存在）
      - name: 重建 better-sqlite3（Electron ABI / ${{ matrix.arch }}）
        run: npx --yes @electron/rebuild@4.2.1 -f -w better-sqlite3 -v 33.4.11 -a ${{ matrix.arch }}

      # eb-config 会跳过 CI 上不存在的 python-runtime / edge-tts 资源
      - name: 打包 macOS（dmg + zip / ${{ matrix.arch }}）
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --config scripts/eb-config.cjs
        env:
          GH_TOKEN: ${{ github.token }}

      # v13.10.1 起 eb-config 已把产物名统一为 ASCII（jutian-agent-*），
      # 这里只做归档重命名（asar 更新包仅 arm64 传一份）
      # v14.11.2：发布前自证该架构安装包真的带了匹配的原生模块。
      # app.asar 自更新包只替换纯 JS 包，带不了 app.asar.unpacked 里的 .node；
      # 只有完整安装包能修。校验失败直接红灯，避免再发出「没有 sqlite」的包。
      - name: 原生模块架构自检（darwin-${{ matrix.arch }}）
        shell: bash
        run: node scripts/verify-native.cjs ${{ matrix.arch }} darwin

      - name: 整理产物名
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist-out
          # asar 更新包：从 .app 取出 app.asar（纯 JS 代码包，跨平台通用），仅 arm64 传一份
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ASAR_SRC=$(find release -path "*Contents/Resources/app.asar" | head -1)
            test -n "$ASAR_SRC" || { echo "no app.asar"; exit 1; }
            cp "$ASAR_SRC" "dist-out/jutian-agent-$VER-app.asar"
          fi
          ARCH="${{ matrix.arch }}"
          DMG=$(find release -name "jutian-agent-*-${ARCH}*.dmg" -maxdepth 1 | head -1)
          ZIP=$(find release -name "jutian-agent-*-${ARCH}*.zip" -maxdepth 1 | head -1)
          [ -n "$DMG" ] && mv "$DMG" "dist-out/jutian-agent-$VER-$ARCH.dmg" || echo "WARN: DMG not found for $ARCH"
          [ -n "$ZIP" ] && mv "$ZIP" "dist-out/jutian-agent-$VER-$ARCH-mac.zip" || echo "WARN: ZIP not found for $ARCH"
          ls -la dist-out/

      - name: 生成发行说明（notice.md 单一来源）
        shell: bash
        run: node scripts/release-notes.mjs --tag ${{ github.ref_name }} --platform mac > release-body.md
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: dist-out/*
          fail_on_unmatched_files: true

      - name: 上传安装包到 Gitee（零额外下载）
        continue-on-error: true
        env:
          GITEE_USER: ${{ secrets.GITEE_USER || 'deepseekv5' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_TAG: ${{ github.ref_name }}
          GITEE_DIST_DIR: dist-out
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 GITEE_TOKEN secret，跳过 Gitee 附件上传"
            exit 0
          fi
          node scripts/upload-gitee-assets.mjs
