# 安卓发行（GitHub Actions）
#
# 两个发行形态，同一次构建产出：
#   jutian-remote-<ver>.apk  远控版（~60KB）—— 连电脑或 Termux 上的服务
#   jutian-local-<ver>.apk   本地版（~40MB）—— 内置 Node 运行时 + 完整前端，
#                            装一个 APK 就能在手机上跑完整 Agent，不依赖电脑
#
# 本地版原理：nodejs-mobile 的 libnode.so 作为原生库打进 APK（Android 10+
# 禁止从应用数据目录 exec，但加载 .so 合法），JNI 桥调用 node::Start 跑
# 解压出来的 serve.cjs，WebView 连 127.0.0.1:3211。跑的是与桌面完全同一份
# 后端与前端——工具、技能市场、对话全在，只是数据存在手机本地。
#
# 两个包用 -PlocalApk 构建参数区分（不用 productFlavors：AGP 8.7 的
# flavor 级 externalNativeBuild DSL 解析不到）。
#
# 签名：密钥从 repo secrets 解码。签名必须与历史 APK 一致——Android 拒绝
# 用不同签名的包覆盖安装。
#
# 触发：打 tag（v*）自动跑；也可手动 dispatch。

name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建后端与前端
        run: npm run build

      # 版本号从 tag 同步（tag 是唯一来源）
      - name: 同步版本号
        run: |
          VER="${GITHUB_REF_NAME#v}"
          CODE=$(python3 -c "v='$VER'.split('.'); print(int(v[0])*1000000+int(v[1])*10000+int(v[2])*100)")
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $CODE/" android/app/build.gradle
          echo "APK 版本: $VER ($CODE)"

      # 手机独立包：同时作为本地版 APK 的内置前端包（assets/mobile.zip）
      - name: 打手机独立包
        run: node scripts/package-mobile.mjs

      # nodejs-mobile：Node 18 的 Android 预编译运行时（libnode.so + 头文件）
      - name: 下载 Node 运行时（nodejs-mobile）
        run: |
          curl -sSL -o /tmp/njm.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          # 三个 ABI 全取：arm64-v8a（主流）、armeabi-v7a（老设备）、x86_64（模拟器）
          mkdir -p android/app/src/main/cpp/include
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "android/app/src/local/jniLibs/$ABI"
            unzip -o -j /tmp/njm.zip "bin/$ABI/libnode.so" -d "android/app/src/local/jniLibs/$ABI/"
            ls -la "android/app/src/local/jniLibs/$ABI/"
          done
          unzip -o /tmp/njm.zip 'include/*' -d /tmp/njm-include/
          cp -r /tmp/njm-include/include/* android/app/src/main/cpp/include/
          test -f android/app/src/main/cpp/include/node/node.h
      - name: 组装本地版内置包
        run: |
          mkdir -p android/app/src/local/assets
          cp /tmp/mobile-out/jutian-mobile-*.zip android/app/src/local/assets/mobile.zip
          ls -la android/app/src/local/assets/

      - name: 安装 NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" > /dev/null
          echo "NDK: $ANDROID_HOME/ndk/26.1.10909125"

      # libnode.so 动态依赖 libc++_shared.so：不打进包会直接 dlopen 失败
      # （真机实测报错：library "libc++_shared.so" not found）。
      # NDK sysroot 里按 triple 命名，需要映射到 ABI 目录名。
      - name: 拷贝 libc++_shared.so（libnode 依赖）
        run: |
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            case "$ABI" in
              arm64-v8a) T=aarch64-linux-android ;;
              armeabi-v7a) T=arm-linux-androideabi ;;
              x86_64) T=x86_64-linux-android ;;
            esac
            # 直接 find 该 triple 的文件本身，不做路径拼接（避免层级错一层）
            SRC=$(find "$ANDROID_HOME/ndk" -name libc++_shared.so -path "*/$T/*" | head -1)
            test -n "$SRC" || { echo "找不到 $T 的 libc++_shared.so"; exit 1; }
            cp "$SRC" "android/app/src/local/jniLibs/$ABI/"
            ls -la "android/app/src/local/jniLibs/$ABI/"
          done


      - name: 解码签名密钥
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/jutian-release.keystore
          printf 'storeFile=jutian-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASS" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASS" > android/keystore.properties
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}

      - name: 构建两个 APK（release 签名）
        run: |
          cd android
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/out

          # 1) 远控版（~60KB）：不带原生运行时与内置前端
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "/tmp/out/jutian-remote-$VER.apk"

          # 2) 本地版：单包通用（三个 ABI 全在内，任何设备装同一个包）
          rm -rf app/build/outputs/apk/release
          gradle assembleRelease -PlocalApk --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk || { echo "本地版未产出 APK"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "/tmp/out/jutian-local-$VER.apk"

          ls -la /tmp/out/

      - name: 核验签名与产物
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort | tail -1)
          for f in /tmp/out/*.apk; do
            echo "== $f ($(du -h "$f" | cut -f1))"
            "$BT/apksigner" verify --print-certs "$f" | head -3
            # 本地版必须真的带上运行时与内置包，否则装上去只是个壳
            case "$f" in
              *jutian-local-*)
                # 单包通用：三个 ABI 的运行时与依赖必须全部在内
                for ABI in arm64-v8a armeabi-v7a x86_64; do
                  unzip -l "$f" | grep -q "lib/$ABI/libnode.so" || { echo "缺少 $ABI/libnode.so"; exit 1; }
                  unzip -l "$f" | grep -q "lib/$ABI/libc++_shared.so" || { echo "缺少 $ABI/libc++_shared.so"; exit 1; }
                  unzip -l "$f" | grep -q "lib/$ABI/libnodejs_bridge.so" || { echo "缺少 $ABI/libnodejs_bridge.so"; exit 1; }
                done
                unzip -l "$f" | grep -q "assets/mobile.zip" || { echo "缺少内置前端包"; exit 1; }
                echo "通用包核验通过：3 个 ABI × 3 个原生库 + 内置前端"
                ;;
            esac
          done

      - name: 整理产物名
        run: |
          cp /tmp/mobile-out/jutian-mobile-*.zip /tmp/out/
          ls -la /tmp/out/

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/out/*
          fail_on_unmatched_files: true
