# Windows 构建（GitHub Actions）
#
# x64 与 arm64 用 matrix 并行。arm64（Snapdragon / Copilot+ PC）：
# better-sqlite3 没有 electron-v130 的 win-arm64 预编译包，
# @electron/rebuild 会退回源码编译——runner 自带 ARM64 版 MSVC 工具链。
#
# asar（应用内更新用）架构无关：只从 x64 任务产出上传，避免同名冲突。

name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # 要上传 Release 资产

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            ebflag: --x64
          - arch: arm64
            ebflag: --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 安装依赖——漏了这一步 ESLint 会报 "'eslint' is not recognized"
      - name: 安装依赖
        run: npm ci

      # 依赖漏洞门禁：只拦 high/critical。registry 不支持 audit 端点时
      # 只警告不拦，避免基建波动堵住发版。
      # shell: bash 必须显式指定——Windows runner 默认 PowerShell，
      # 这套 set +e / $? / fi 语法会直接 ParserError（实测踩过）。
      - name: 依赖漏洞门禁(high/critical)
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high > "$RUNNER_TEMP/audit.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/audit.log"
          if grep -qE '[0-9]+ (high|critical) severity vulnerabilit|severity vulnerabilities' "$RUNNER_TEMP/audit.log"; then
            echo "::error::发现 high/critical 级别依赖漏洞，请先处理"
            exit 1
          fi
          echo "::warning::npm audit 未完成(registry 不支持 audit 端点或网络问题)，本次跳过漏洞门禁"

      - name: ESLint（零 error）
        run: npm run lint

      - name: TypeScript 类型门禁（零 error）
        run: npm run check

      - name: 契约校验
        run: npm run verify

      - name: 构建后端
        run: npm run build:server

      - name: 构建前端
        run: npx vite build

      - name: 测试
        run: npm test

      # better-sqlite3 原生模块：换成 Electron 对应 ABI（v130）。
      # x64 有官方预编译；arm64 无预编译，@electron/rebuild 退回源码编译
      # （runner 自带 ARM64 版 MSVC 工具链，多花几分钟）。
      - name: 重建 better-sqlite3（Electron ABI / ${{ matrix.arch }}）
        shell: bash
        run: npx --yes @electron/rebuild@4.2.1 -f -w better-sqlite3 -v 33.4.11 -a ${{ matrix.arch }}

      # Windows 包也要带 TTS：runner 上没有本机的 openai-edge-tts 目录，
      # 直接在 CI 里浅克隆一份，EDGE_TTS_DIR 指过去，eb-config 就会把它
      # 收进 resources/edge-tts。克隆失败不阻断打包（资源会被跳过）。
      - name: 准备 edge-tts 资源
        shell: bash
        run: |
          git clone --depth 1 https://github.com/roudy/openai-edge-tts "$RUNNER_TEMP/openai-edge-tts" \
            && echo "EDGE_TTS_DIR=$RUNNER_TEMP/openai-edge-tts" >> "$GITHUB_ENV" \
            || echo "::warning::edge-tts 克隆失败，本次包不含 TTS 资源"

      # v12.8 起产出 NSIS 安装包；asar 仍从 win-unpacked/resources 取，
      # 一个命令两条产物线。
      - name: 打包 Windows（${{ matrix.arch }}）
        run: npx electron-builder --win ${{ matrix.ebflag }} --config scripts/eb-config.cjs
        env:
          GH_TOKEN: ${{ github.token }}

      # app.asar（应用内自更新用）直接取 electron-builder 的打包产物。
      # 之前是 `asar pack .` 现打——那会把整个 node_modules 都塞进去
      # （实测 565MB，用户端自更新等于下载全仓库）。
      # asar 架构无关：只从 x64 任务产出上传，arm64 跳过（同名冲突）。
      - name: 取 app.asar（应用内更新用）
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          mkdir -p asar-out
          cp release/win-unpacked/resources/app.asar "asar-out/jutian-agent-${GITHUB_REF_NAME#v}-app.asar"
          ls -la asar-out/

      # 产物目录是 release/（package.json 的 build.directories.output），
      # 不是 dist/——之前这里写 dist/*.exe，glob 一个都匹配不上，
      # Release 里就没有任何 Windows 安装包。
      - name: 列出产物（排障用）
        shell: bash
        run: ls -la release/*.exe asar-out/*.asar 2>&1 || true

      # latest.yml 与 asar 只属于 x64 任务（arm64 上传会同名冲突）。
      - name: 上传到 Release（${{ matrix.arch }}）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            ${{ matrix.arch == 'x64' && 'release/latest.yml' || 'asar-out/.keep' }}
            ${{ matrix.arch == 'x64' && 'asar-out/*.asar' || 'asar-out/.keep' }}
          fail_on_unmatched_files: false
