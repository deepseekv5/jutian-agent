# Windows 打包（GitHub Actions）
#
# 本机（macOS）无 wine，无法交叉打包 win-x64；electron-builder 的 win
# 打包需要 wine 来生成 nsis 安装包。所以走 CI：在 windows-latest runner 上
# 原生打包，产物自动挂到 Release。
#
# 触发：打 tag（v*）后自动跑；也可手动 dispatch。
name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # 要上传 Release 资产

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # 安装依赖——漏了这一步 ESLint 会报 "'eslint' is not recognized"
      - name: 安装依赖
        run: npm ci

      # 依赖漏洞门禁：只拦 high/critical。registry 不支持 audit 端点时
      # 只警告不拦，避免基建波动堵住发版。
      # shell: bash 是必须的——Windows runner 默认 PowerShell，这套 bash 语法
      # （set +e / $? / fi）会直接 ParserError（实测踩过）。
      - name: 依赖漏洞门禁(high/critical)
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high > /tmp/audit.log 2>&1
          code=$?
          set -e
          cat /tmp/audit.log
          if grep -qE '[0-9]+ (high|critical) severity vulnerabilit|severity vulnerabilities' /tmp/audit.log; then
            echo "::error::发现 high/critical 级别依赖漏洞，请先处理"
            exit 1
          fi
          echo "::warning::npm audit 未完成(registry 不支持 audit 端点或网络问题)，本次跳过漏洞门禁"

      - name: ESLint（零 error）
        run: npm run lint

      - name: TypeScript 类型门禁（零 error）
        run: npm run check

      - name: 契约校验
        run: npm run verify

      - name: 构建后端
        run: npm run build:server

      - name: 构建前端
        run: npx vite build

      - name: 测试
        run: npm test

      # better-sqlite3 原生模块：Windows 上必须换成 Electron 对应的 ABI
      # （v130），否则 Electron 跑起来时报 NODE_MODULE_VERSION 不匹配。
      # 包名是 @electron/rebuild（旧名 electron-rebuild 停在 3.2.9；
      # 之前写 electron-rebuild@3.2.10 会 ETARGET，实测踩过）。
      - name: 重建 better-sqlite3（Electron ABI）
        shell: bash
        run: |
          npx --yes @electron/rebuild@4.2.1 -f -w better-sqlite3 -v 33.4.11

      # Windows 包也要带 TTS：runner 上没有本机的 openai-edge-tts 目录，
      # 直接在 CI 里浅克隆一份，EDGE_TTS_DIR 指过去，eb-config 就会把它
      # 收进 resources/edge-tts。克隆失败不阻断打包（资源会被跳过）。
      - name: 准备 edge-tts 资源
        shell: bash
        run: |
          git clone --depth 1 https://github.com/roudy/openai-edge-tts "$RUNNER_TEMP/openai-edge-tts" \
            && echo "EDGE_TTS_DIR=$RUNNER_TEMP/openai-edge-tts" >> "$GITHUB_ENV" \
            || echo "::warning::edge-tts 克隆失败，本次包不含 TTS 资源"

      # v12.2 起只要 app.asar（应用内更新用），不再生成 NSIS 安装包：
      # `--dir` 只产出 win-unpacked（含 app.asar），跳过 NSIS 编译，
      # 既省 CI 时间，也保证 Release 里不会再出现 exe。
      - name: 打包（仅产出 app.asar，不打安装包）
        run: npx electron-builder --win --x64 --dir --config scripts/eb-config.cjs
        env:
          GH_TOKEN: ${{ github.token }}

      # app.asar（应用内自更新用）直接取 electron-builder 的打包产物。
      # 之前是 `asar pack .` 现打——那会把整个 node_modules 都塞进去
      # （实测 565MB，用户端自更新等于下载全仓库）。electron-builder
      # 已按 files 白名单打好 48MB 量级的 app.asar，原样取用即可。
      - name: 取 app.asar（应用内更新用）
        shell: bash
        run: |
          mkdir -p asar-out
          cp release/win-unpacked/resources/app.asar "asar-out/jutian-agent-${GITHUB_REF_NAME#v}-app.asar"
          ls -la asar-out/

      # 产物目录是 release/（package.json 的 build.directories.output），
      # 不是 dist/——之前这里写 dist/*.exe，glob 一个都匹配不上，
      # 于是 Release 里永远只有 app.asar、没有任何 Windows 安装包，
      # 用户「只能下载旧的 asar、装不上新版」就是这么来的。
      - name: 列出产物（排障用）
        shell: bash
        run: ls -la asar-out/*.asar 2>&1 || true

      # v12.2 起只发布 asar 更新包，不再上传 exe 安装包。
      # 已有用户的更新走 app.asar；新用户由官网/Release 页说明引导。
      - name: 上传更新包到 Release（仅 asar）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            asar-out/*.asar
          fail_on_unmatched_files: false
