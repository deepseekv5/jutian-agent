# Gitee 镜像同步（v14.8.4）
#
# 触发方式：
#   1. push main / 打 tag  → 自动镜像 git
#   2. workflow_dispatch   → mode=mirror（只推 git）或 mode=sync-history（补全部历史发行版）
#
# 令牌来源：Secrets.GITEE_USER/GITEE_TOKEN（推荐），或 dispatch 时传 inputs.gitee_user/gitee_token。
# 发行版同步逻辑在 scripts/sync-gitee-releases.mjs（GitHub 服务器端运行，零本机流量）。

name: Sync Gitee

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'mirror 或 sync-history（同步全部历史发行版）'
        required: false
        default: 'mirror'
      gitee_user:
        description: 'Gitee 用户名（一次性）'
        required: false
      gitee_token:
        description: 'Gitee 私人令牌（一次性）'
        required: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备令牌
        id: tok
        run: |
          USER="${{ secrets.GITEE_USER || inputs.gitee_user || '' }}"
          TOKEN="${{ secrets.GITEE_TOKEN || inputs.gitee_token || '' }}"
          if [ -z "$USER" ] || [ -z "$TOKEN" ]; then
            echo "::warning::未配置 Gitee 令牌，跳过"
            exit 0
          fi
          echo "USER=$USER" >> $GITHUB_OUTPUT
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: 推送 Git（main + tags）
        if: steps.tok.outputs.USER
        env:
          GITEE_USER: ${{ steps.tok.outputs.USER }}
          GITEE_TOKEN: ${{ steps.tok.outputs.TOKEN }}
        run: |
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/jutian-agent.git"
          for i in 1 2 3; do
            git push gitee main --force --tags && break
            echo "第 $i 次推送失败，重试..."
            sleep 10
          done

  sync-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v14.8.4 修复：必须先 checkout 才有 scripts/sync-gitee-releases.mjs
      - uses: actions/checkout@v4

      - name: 同步发行版（历史补建）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sync-history'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_USER: ${{ secrets.GITEE_USER || inputs.gitee_user || '' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || inputs.gitee_token || '' }}
        run: node scripts/sync-gitee-releases.mjs
