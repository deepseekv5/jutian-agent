# Gitee 镜像同步（v14.9.1）
#
# 触发方式：
#   1. push main / 打 tag  → 镜像 git + 同步该 tag 的发行版（文本+安装包资产）
#   2. workflow_dispatch   → mode=sync-history 补全部历史发行版文本（不搬资产）
#      或传 tag=vX.Y.Z   → 同步指定 tag（文本+资产）
#
# 令牌来源：Secrets.GITEE_USER/GITEE_TOKEN（推荐），或 dispatch 时传 inputs。
# 资产流量：GitHub runner 下载 GitHub Releases CDN → 直传 Gitee，用户本机零流量。

name: Sync Gitee

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'mirror 或 sync-history（同步全部历史发行版文本）'
        required: false
        default: 'mirror'
      tag:
        description: '指定 tag 同步（文本+资产），如 v14.9.0'
        required: false
      gitee_user:
        description: 'Gitee 用户名（一次性）'
        required: false
      gitee_token:
        description: 'Gitee 私人令牌（一次性）'
        required: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备令牌
        id: tok
        run: |
          USER="${{ secrets.GITEE_USER || inputs.gitee_user || '' }}"
          TOKEN="${{ secrets.GITEE_TOKEN || inputs.gitee_token || '' }}"
          if [ -z "$USER" ] || [ -z "$TOKEN" ]; then
            echo "::warning::未配置 Gitee 令牌，跳过"
            exit 0
          fi
          echo "USER=$USER" >> $GITHUB_OUTPUT
          echo "TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: 推送 Git（main + tags）
        if: steps.tok.outputs.USER
        env:
          GITEE_USER: ${{ steps.tok.outputs.USER }}
          GITEE_TOKEN: ${{ steps.tok.outputs.TOKEN }}
        run: |
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/jutian-agent.git"
          for i in 1 2 3; do
            git push gitee main --force --tags && break
            echo "第 $i 次推送失败，重试..."
            sleep 10
          done

  sync-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 同步发行版（tag 推送：文本+资产；手动：历史文本）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_USER: ${{ secrets.GITEE_USER || inputs.gitee_user || '' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || inputs.gitee_token || '' }}
          GITEE_ONLY_TAG: '${{ startsWith(github.ref, "refs/tags/") ? github.ref_name : (inputs.tag || "") }}'
          GITEE_SYNC_ASSETS: '${{ startsWith(github.ref, "refs/tags/") || (inputs.tag != "") ? "1" : "0" }}'
        run: node scripts/sync-gitee-releases.mjs
