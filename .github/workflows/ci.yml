name: CI

# 令牌最小权限：只读内容，避免 workflow 被投毒后能改仓库/发 release
permissions:
  contents: read

# 同一分支连续推送时取消上一个还在跑的流程，省配额也避免结果互相覆盖
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 依赖漏洞门禁：只拦 high/critical。
      # 当前审计里的 moderate 几乎全部来自 tailwind → braces 这类纯 devDep 链，
      # 不影响发布物，故不按 moderate 拦截；有新增 high 时再逐个消。
      # 注意：npm audit 在 registry 不支持 audit 端点时也返回非零，
      # 这里按输出内容区分「真有漏洞」和「registry/网络问题」，
      # 后者只警告不拦，避免基建波动堵住正常 PR
      - name: 依赖漏洞门禁(high/critical)
        run: |
          set +e
          npm audit --audit-level=high > /tmp/audit.log 2>&1
          code=$?
          set -e
          cat /tmp/audit.log
          if grep -qE '[0-9]+ (high|critical) severity vulnerabilit|severity vulnerabilities' /tmp/audit.log; then
            echo "::error::发现 high/critical 级别依赖漏洞，请先处理"
            exit 1
          fi
          echo "::warning::npm audit 未完成(registry 不支持 audit 端点或网络问题)，本次跳过漏洞门禁"

      - name: ESLint(零 error)
        run: npm run lint

      - name: TypeScript 类型门禁(零 error)
        run: npm run check

      - name: 契约校验(工具 schema / 约束知识库 / 免 key 常量)
        run: npm run verify

      - name: 构建后端(serve.cjs)
        run: npm run build:server

      # 安全回归测试：起真实服务打端点，覆盖路径穿越 / 目录白名单 / SSRF。
      # 必须排在 build:server 之后——测试直接 spawn serve.cjs
      - name: 安全回归测试
        run: npm test

      - name: 构建前端(dist/)
        run: npx vite build

      # 冒烟：serve.cjs 能真起来并答 /api/health，避免"构建过了但服务起不来"
      - name: 冒烟启动 serve.cjs
        run: |
          PORT=3219 node serve.cjs > /tmp/serve.log 2>&1 &
          SRV=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3219/api/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h||h.status!=='ok'){console.error('health 检查失败'); process.exit(1)}"
          kill $SRV 2>/dev/null || true

      - name: 上传构建产物(供排查,3 天)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error
